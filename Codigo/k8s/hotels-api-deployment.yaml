apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotels-api
  labels:
    app: hotels-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotels-api
  template:
    metadata:
      labels:
        app: hotels-api
    spec:
      containers:
      - name: hotels-api
        image: hotels-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9090
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "9090"
        - name: MONGODB_URI
          value: "mongodb://admin:password123@mongodb-service:27017/hotels_bogota?authSource=admin"
        - name: FRONTEND_URL
          value: "http://localhost:5000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hotels-api-service
spec:
  selector:
    app: hotels-api
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP

